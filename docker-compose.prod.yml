version: "3.8"

services:
  db:
    image: postgres:16-alpine
    env_file:
      - ./.env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  migrate:
    image: ghcr.io/keelfy/family-budget-app/api:latest
    entrypoint: ["python", "db/migrate.py"]
    env_file:
      - ./apps/api/.env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    networks:
      - app-network

  api:
    image: ghcr.io/keelfy/family-budget-app/api:latest
    env_file:
      - ./apps/api/.env
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  web:
    image: ghcr.io/keelfy/family-budget-app/web:latest
    env_file:
      - ./apps/web/.env
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
